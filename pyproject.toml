[project]
name = "forge"
version = "0.0.1"
description = "Run training jobs on whatever GPU time you have, moving them between accounts by snapshot."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "kaggle==2.2.4",
    "modal==1.6.1",
    "numpy>=2.4.6",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "import-linter"]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "mkdocs-include-markdown-plugin==7.3.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

# Rules are only ever tightened. Loosening one needs its own commit saying why.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "C90", "PTH", "RUF", "PL",
    "ANN",                                   # every function is typed
    "D100", "D101", "D102", "D103", "D104",  # every public module, class and function says what it is for
    "PGH",                                   # no blanket `# type: ignore` or `# noqa`
    "ERA",                                   # no commented-out code
    "FIX",                                   # no TODO, FIXME, XXX or HACK left behind
    "T20",                                   # no print outside scripts
    "BLE",                                   # no catch-all except
    "S101",                                  # no assert outside tests
    "TID",                                   # absolute imports only
    "ARG", "RET", "PIE",
    "FBT",                                   # no boolean flag arguments
    "DTZ",                                   # no naive datetimes: quotas reset in UTC
]
ignore = ["PLR0913"]  # CLI entry points legitimately take many options

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "D", "FBT", "DTZ001"]
"scripts/**" = ["T20"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src/forge/core"]
exclude = ["**/.venv", "**/__pycache__"]
extraPaths = ["scripts"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.importlinter]
root_packages = ["forge"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core sits below everything that does I/O"
type = "layers"
layers = ["(forge.cli)", "(forge.providers)", "(forge.ledger)", "forge.core"]

[[tool.importlinter.contracts]]
name = "The core reads no clock, file or network and uses no cloud or ML library"
type = "forbidden"
source_modules = ["forge.core"]
forbidden_modules = [
    "modal", "kaggle", "boto3", "azure", "requests", "httpx", "torch",
    "huggingface_hub", "subprocess", "socket",
]
